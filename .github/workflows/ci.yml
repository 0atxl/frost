name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0 gvfs-daemons gvfs-backends dbus-x11
      - run: npm ci
      - name: Run complete test suite in an isolated desktop session
        run: |
          state=$(mktemp -d "$RUNNER_TEMP/frost-ci-XXXXXX")
          trap 'rm -rf "$state"' EXIT
          export TMPDIR="$state/tmp"
          export XDG_DATA_HOME="$state/data"
          export XDG_CONFIG_HOME="$state/config"
          export XDG_CACHE_HOME="$state/cache"
          export XDG_RUNTIME_DIR="$state/runtime"
          mkdir -p "$TMPDIR" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- npm test
      - run: npm run build
