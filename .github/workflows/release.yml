name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag; leave empty for a build-only candidate of the selected ref
        type: string
        default: ""
      publish:
        description: Publish the checked tag after all required jobs pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact release commit and version
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          tag="$INPUT_TAG"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; publish=true; fi
          if [[ "$INPUT_PUBLISH" == true ]]; then publish=true; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$tag" == "v$version" ]]
            [[ "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]]
          fi
          if [[ "$publish" == true ]]; then
            [[ -n "$tag" ]]
            test -s LICENSE
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Read the pinned runtime
        id: runtime
        run: |
          source scripts/release/node.env
          echo "version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.version }}
          cache: npm
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0 gvfs-daemons gvfs-backends dbus-x11
      - run: npm ci --include=optional
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      - name: Run all existing tests against this commit
        run: bash scripts/ci/desktop-session.sh npm test
      - run: npm run build
      - name: Check and build the independent static website
        run: |
          for script in landing/*.js landing/*.mjs; do node --check "$script"; done
          node landing/build.mjs
      - name: Package the compiled application and verified runtime
        run: bash scripts/release/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frost-distribution-${{ steps.identity.outputs.commit }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14

  extracted-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frost-distribution-${{ needs.build.outputs.commit }}
          path: release-output
      - name: Install system desktop requirements
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0 gvfs-daemons gvfs-backends dbus-x11
      - name: Verify checksums and exercise the extracted archive without npm install
        run: |
          (cd release-output && sha256sum --check --strict SHA256SUMS)
          bash scripts/ci/desktop-session.sh node scripts/release/smoke.mjs release-output/frost-*-linux-x64.tar.gz

  publish:
    needs: [build, extracted-package]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frost-distribution-${{ needs.build.outputs.commit }}
          path: release-output
      - name: Verify and publish complete assets through a recoverable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          (cd release-output && sha256sum --check --strict SHA256SUMS)
          node scripts/release/publish.mjs

  refresh-website:
    needs: publish
    uses: ./.github/workflows/website.yml
    secrets: inherit
